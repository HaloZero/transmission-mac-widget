name: TorrentMacWidget

options:
  bundleIdPrefix: com.halozero
  deploymentTarget:
    macOS: "14.0"          # containerBackground(_:for:) needs macOS 14+/iOS 17+
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "78SRTVN985"

targets:
  TorrentMacWidget:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        INFOPLIST_KEY_LSUIElement: "YES"          # menu-bar only, no Dock icon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.halozero.torrentmacwidget.debug
          INFOPLIST_KEY_CFBundleDisplayName: "Torrent Widget Debug"
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.halozero.torrentmacwidget
          INFOPLIST_KEY_CFBundleDisplayName: "Torrent Widget"
    entitlements:
      path: App/TorrentMacWidget.entitlements
      properties:
        # This app does nothing but show a menu bar icon + Quit — the widget
        # extension owns fetching, caching, and configuration entirely on
        # its own. No network/App Group/Keychain entitlements needed here.
        com.apple.security.app-sandbox: true
    dependencies:
      - target: TorrentMacWidgetExtension
        embed: true
        codeSign: true

  TorrentMacWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: "YES"
        SKIP_INSTALL: "YES"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.halozero.torrentmacwidget.debug.widget
          WIDGET_DISPLAY_NAME: "Torrent Widget Debug"
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.halozero.torrentmacwidget.widget
          WIDGET_DISPLAY_NAME: "Torrent Widget"
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CFBundleDisplayName: "$(WIDGET_DISPLAY_NAME)"
        NSLocalNetworkUsageDescription: "Connects to your Transmission or qBittorrent server on your local network to show torrent status."
    entitlements:
      path: Widget/TorrentMacWidgetExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

  ScreenshotRenderer:
    type: tool
    platform: macOS
    sources:
      - path: Shared
      - path: Widget/TorrentWidgetView.swift
      - path: Widget/TorrentEntry.swift
      - path: Widget/TorrentProvider.swift
      - path: Widget/TorrentWidgetConfigurationIntent.swift
      - path: Tools/ScreenshotRenderer
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  TorrentMacWidget:
    build:
      targets:
        TorrentMacWidget: all
    run:
      config: Debug

  TorrentMacWidgetExtension:
    build:
      targets:
        TorrentMacWidgetExtension: all
    run:
      config: Debug

  ScreenshotRenderer:
    build:
      targets:
        ScreenshotRenderer: all
    run:
      config: Debug
