name: TransmissionWidgetHost

options:
  bundleIdPrefix: com.halozero
  deploymentTarget:
    macOS: "14.0"          # containerBackground(_:for:) needs macOS 14+/iOS 17+
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "78SRTVN985"

targets:
  TransmissionWidgetHost:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        INFOPLIST_KEY_LSUIElement: "YES"          # menu-bar only, no Dock icon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connects to your Transmission server on your local network to show torrent status."
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.halozero.transmissionwidget.debug
          INFOPLIST_KEY_CFBundleDisplayName: "TransmissionWidget Debug"
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.halozero.transmissionwidget
          INFOPLIST_KEY_CFBundleDisplayName: "TransmissionWidget"
    entitlements:
      path: App/TransmissionWidgetHost.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.com.halozero.transmissionwidget
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.halozero.transmissionwidget
    dependencies:
      - target: TransmissionWidgetExtension
        embed: true
        codeSign: true

  TransmissionWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: "YES"
        SKIP_INSTALL: "YES"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.halozero.transmissionwidget.debug.widget
          WIDGET_DISPLAY_NAME: "TransmissionWidget Debug"
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.halozero.transmissionwidget.widget
          WIDGET_DISPLAY_NAME: "TransmissionWidget"
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CFBundleDisplayName: "$(WIDGET_DISPLAY_NAME)"
        NSLocalNetworkUsageDescription: "Connects to your Transmission server on your local network to show torrent status."
    entitlements:
      path: Widget/TransmissionWidgetExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.com.halozero.transmissionwidget
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.halozero.transmissionwidget

  ScreenshotRenderer:
    type: tool
    platform: macOS
    sources:
      - path: Shared
      - path: Widget/TransmissionWidgetView.swift
      - path: Widget/TorrentEntry.swift
      - path: Widget/TorrentProvider.swift
      - path: Tools/ScreenshotRenderer
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  TransmissionWidgetHost:
    build:
      targets:
        TransmissionWidgetHost: all
    run:
      config: Debug

  TransmissionWidgetExtension:
    build:
      targets:
        TransmissionWidgetExtension: all
    run:
      config: Debug

  ScreenshotRenderer:
    build:
      targets:
        ScreenshotRenderer: all
    run:
      config: Debug
